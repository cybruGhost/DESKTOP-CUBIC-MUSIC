name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop release version
        required: true
      build_run_id:
        description: Successful Build desktop packages workflow run ID
        required: true
      source_sha:
        description: Commit used to build the packages
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish Linux and Windows packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download and verify build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release-assets
          for extension in tar.gz deb rpm zip exe msi; do
            if ! find release-assets -type f -name "*.$extension" -print -quit | grep -q .; then
              echo "Missing .$extension release asset" >&2
              exit 1
            fi
          done
          find release-assets -type f -printf '%p %s bytes\n'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.zip' -o -name '*.exe' -o -name '*.msi' \) -print0)
          if [ "${#assets[@]}" -ne 6 ]; then
            echo "Expected six release assets, found ${#assets[@]}" >&2
            exit 1
          fi
          gh release create "v$VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Cubic Music Desktop v$VERSION" \
            --notes "Linux and Windows desktop packages: portable archives, DEB/RPM and EXE/MSI installers. This release also adds the compact mini-player, a Profile update checker, and fixes downloads selecting silent video-only formats. Existing silent files should be downloaded again."
